name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://gogo:gogo@localhost:5432/gogo
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Postgres
        run: docker compose up -d --wait

      - name: Install
        run: uv sync --python 3.12

      - name: Test
        run: uv run pytest -q

      - name: Stop Postgres
        if: always()
        run: docker compose down
