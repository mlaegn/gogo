[project]
name = "gogo"
version = "0.1.0"
description = "Go / no-go surf windows for the Lisbon–Ericeira–Peniche coast."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "uvicorn>=0.34",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
]

[project.scripts]
gogo = "gogo.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gogo"]
# Vite output is gitignored, and hatchling excludes ignored files by default — so
# without this the wheel would ship the routes and no app. `artifacts` is the escape
# hatch for build products that must travel anyway. Build the UI before the wheel.
artifacts = ["src/gogo/static/app/**"]

[tool.hatch.build.targets.sdist]
include = ["src/gogo", "README.md", "web"]
artifacts = ["src/gogo/static/app/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
