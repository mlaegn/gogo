[project]
name = "gogo"
version = "0.1.0"
description = "Go / no-go surf windows for the Lisbon–Ericeira–Peniche coast."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
gogo = "gogo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gogo"]

[tool.hatch.build.targets.sdist]
include = ["src/gogo", "spots", "migrations", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
