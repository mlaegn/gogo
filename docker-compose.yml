services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gogo
      POSTGRES_PASSWORD: gogo
      POSTGRES_DB: gogo
    ports:
      - "5432:5432"
    # No initdb mount: the schema is applied by `gogo migrate`, so a fresh database and
    # an existing one take the same path and every change is recorded.
    volumes:
      - gogo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gogo -d gogo"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  gogo_pg:
