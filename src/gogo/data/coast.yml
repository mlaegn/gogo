# Hand-curated. Windows are drafts — argue with a fixture, then edit here.
# Directions are "from" in meteorological degrees (0 = N, 90 = E, 270 = W).
# offshore_from: wind direction that is offshore at this spot.
# faces_deg / exposure: measured, not judged — scripts/spot_geometry.py from the OSM
#   coastline (2026-10-06) and a year of reanalysis swell. faces_deg is the shore
#   normal, the swell direction that meets the beach square-on. exposure is sheltered
#   when land blocks over 20% of the swell energy reaching the spot's marine cell.
# shadow_sectors: from the same script — arcs of "from" bearings, read clockwise, from
#   which land 1–60 km out blocks the open sea, within 90° of faces_deg.
#   Rerun the script when a spot is added or its coordinates change.

