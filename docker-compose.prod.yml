# Host stack: Postgres + worker always; the page is `--profile web`.
# Copy `.env.example` to `.env` on the box and fill POSTGRES_PASSWORD
# (`openssl rand -hex 32`). Never commit `.env`.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml --profile web up -d
#
# Postgres is not published. The API binds 127.0.0.1:8000 — put Caddy/nginx in
# front, or SSH-tunnel. Local `make up` still uses docker-compose.yml.

name: gogo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gogo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}
      POSTGRES_DB: ${POSTGRES_DB:-gogo}
    volumes:
      - gogo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: &log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build: .
    image: gogo:local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gogo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gogo}
      # Optional. The healthcheck below pings this only when healthy, so silence is the
      # alarm — which is the only kind that survives the box dying.
      GOGO_HEARTBEAT_URL: ${GOGO_HEARTBEAT_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # A stopped worker looks exactly like a running one: no error, no empty page, just
    # a timestamp that quietly stops moving. This is what makes that visible in
    # `docker compose ps`. Note what it does not do — Docker marks a container
    # unhealthy, it does not restart it, and it should not: the loop is designed to
    # survive a bad hour at Open-Meteo rather than exit on it. Treat "unhealthy" as the
    # alarm and `docker compose exec worker gogo health` as the detail.
    #
    # start_period covers a cold database, where nothing is stored until the first
    # cycle finishes. `run_forever` fetches before it waits, so that is a minute, not
    # an interval.
    healthcheck:
      test: ["CMD", "gogo", "health"]
      interval: 300s
      timeout: 30s
      retries: 2
      start_period: 300s
    logging: *log

  api:
    profiles: ["web"]
    build: .
    image: gogo:local
    # --proxy-headers is load-bearing, not tidiness. The login cookie carries the
    # shared secret and gets its `Secure` flag from the request scheme; behind any TLS
    # terminator (Caddy, nginx, `tailscale serve`) the app sees plain http, so without
    # this the secret would be eligible to travel unencrypted. The flag makes uvicorn
    # read X-Forwarded-Proto instead.
    #
    # `--forwarded-allow-ips=*` trusts that header from anywhere, which is safe only
    # because of the port binding below: 8000 is published on 127.0.0.1, and the cloud
    # firewall allows nothing but SSH, so the only thing that can reach uvicorn is
    # already on this box.
    command:
      [
        "uvicorn",
        "gogo.api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--proxy-headers",
        "--forwarded-allow-ips",
        "*",
      ]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gogo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gogo}
      GOGO_WEB_SECRET: ${GOGO_WEB_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *log

  # TLS terminator. Its own profile, not `web`, because the page has two audiences and
  # only one of them needs a certificate: `make host-web` serves you over an SSH tunnel
  # or a tailnet, `make host-public` serves everyone else over a real domain. Bundling
  # Caddy into `web` would start it with no domain set and have it sit there issuing a
  # certificate for "localhost", which is pure noise.
  #
  # GOGO_DOMAIN still has a harmless default rather than `:?`. Compose interpolates the
  # whole file before it filters by profile, so a required variable here would break
  # plain `make host` for anyone running only the worker.
  caddy:
    profiles: ["public"]
    image: caddy:2-alpine
    environment:
      GOGO_DOMAIN: ${GOGO_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # caddy_data holds the certificates and the ACME account. It has to persist:
      # a throwaway volume means re-issuing on every restart, and Let's Encrypt allows
      # five certificates per domain per week before it starts refusing.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *log

volumes:
  gogo_pg:
  caddy_data:
  caddy_config:
